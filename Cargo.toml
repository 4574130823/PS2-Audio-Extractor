[package]
name = "ps2audioextractor"
version = "0.1.0"
edition = "2024"

[dependencies]
tao = "0.37.1"
wry = "0.57.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"
open = "5.4.4"
aho-corasick = "1.1"
flate2 = "1.1"
lewton = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
